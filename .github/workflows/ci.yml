name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm exec astro check
      - run: pnpm exec vitest run
      - run: pnpm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
      TEST_NEON_FETCH_ENDPOINT: http://db.localtest.me:4444/sql
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stub the Neon control plane table used by the proxy
        run: >-
          psql postgres://postgres:postgres@localhost:5432/main -c
          "CREATE SCHEMA IF NOT EXISTS neon_control_plane; CREATE TABLE IF NOT EXISTS neon_control_plane.endpoints (endpoint_id text PRIMARY KEY, allowed_ips text[])"
      - name: Apply migrations
        run: node scripts/migrate.mjs
        env:
          POSTGRES_URL: ${{ env.TEST_DATABASE_URL }}
          NEON_FETCH_ENDPOINT: ${{ env.TEST_NEON_FETCH_ENDPOINT }}
      - run: pnpm exec vitest run src/tests/integration
